[package]
name = "mdview"
version = "0.1.0"
description = "Lightweight, instant-open Markdown reader"
authors = ["Robin"]
edition = "2021"

[lib]
name = "mdview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
walkdir = "2.5"
url = "2"
rfd = "0.15"

